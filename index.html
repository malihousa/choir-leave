<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合唱團請假系統</title>
<style>
  :root {
    --primary: #4A90D9;
    --primary-dark: #3574b3;
    --primary-light: #eaf2fb;
    --danger: #d9534f;
    --danger-light: #fdeceb;
    --success: #2f9e5c;
    --success-light: #eaf6ec;
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #e1e5ea;
    --text: #2c3444;
    --muted: #7a8494;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "PingFang TC", "Microsoft JhengHei", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .page { width: 100%; max-width: 520px; }
  .header { text-align: center; margin-bottom: 20px; }
  .header .emoji { font-size: 34px; }
  .header h1 { font-size: 22px; margin: 6px 0 4px; }
  .header .today { font-size: 13px; color: var(--muted); }

  .card {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    padding: 24px;
  }

  .notice {
    background: var(--primary-light);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.7;
    color: var(--primary-dark);
    margin-bottom: 22px;
  }

  label {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 10px;
  }
  label .req { color: var(--danger); }
  label .opt-hint { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 4px; }

  .field { margin-bottom: 22px; }

  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    background: #fff;
  }
  input[type=text]:focus { outline: none; border-color: var(--primary); }

  .option-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .option-card {
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 18px 8px;
    text-align: center;
    cursor: pointer;
    background: #fff;
    transition: all .12s;
    user-select: none;
  }
  .option-card .icon { font-size: 26px; display: block; margin-bottom: 6px; }
  .option-card .label { font-size: 15px; font-weight: 600; color: var(--text); }
  .option-card:hover { border-color: #c3d8ef; }
  .option-card.selected {
    border-color: var(--primary);
    background: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(74,144,217,0.15);
  }
  .option-card.selected .label { color: var(--primary-dark); }
  .option-card.danger.selected {
    border-color: var(--danger);
    background: var(--danger-light);
    box-shadow: 0 0 0 3px rgba(217,83,79,0.12);
  }
  .option-card.danger.selected .label { color: var(--danger); }

  input[type=date] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    background: #fff;
    font-family: inherit;
  }
  input[type=date]:focus { outline: none; border-color: var(--primary); }

  .date-msg {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
    display: none;
  }
  .date-msg.show { display: block; }
  .date-msg.ok    { background: var(--success-light); color: var(--success); }
  .date-msg.error { background: var(--danger-light); color: var(--danger); }
  .date-msg.info  { background: var(--primary-light); color: var(--primary-dark); }

  .submit-btn {
    width: 100%;
    padding: 14px 0;
    border: none;
    border-radius: 12px;
    background: var(--primary);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .15s, background .15s;
  }
  .submit-btn:disabled { opacity: .5; cursor: not-allowed; }
  .submit-btn.danger { background: var(--danger); }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin-right: 6px;
    vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="page">
  <div class="header">
    <div class="emoji">🎵</div>
    <h1>合唱團請假系統</h1>
    <div class="today" id="todayBadge">今天是 —</div>
  </div>

  <div class="card">
    <div class="notice">
      📌 <strong>請假</strong>：選好日期送出即可。<br>
      🔄 <strong>銷假</strong>：若之後能出席，再填一次選「銷假」，系統會確認原本有請假紀錄才會取消。
    </div>

    <div class="field">
      <label>姓名 <span class="req">*</span></label>
      <input type="text" id="nameInput" placeholder="請輸入你的姓名">
    </div>

    <div class="field">
      <label>所屬團 <span class="req">*</span></label>
      <div class="option-grid">
        <div class="option-card" data-group="星期四團" data-weekday="4">
          <span class="icon">📅</span>
          <span class="label">星期四團</span>
        </div>
        <div class="option-card" data-group="星期六團" data-weekday="6">
          <span class="icon">📅</span>
          <span class="label">星期六團</span>
        </div>
      </div>
    </div>

    <div class="field">
      <label>動作 <span class="req">*</span></label>
      <div class="option-grid">
        <div class="option-card" data-action="請假">
          <span class="icon">🙏</span>
          <span class="label">請假</span>
        </div>
        <div class="option-card danger" data-action="銷假">
          <span class="icon">✅</span>
          <span class="label">銷假（取消請假）</span>
        </div>
      </div>
    </div>

    <div class="field">
      <label>請假日期 <span class="req">*</span> <span class="opt-hint">限選星期四或星期六</span></label>
      <input type="date" id="dateInput">
      <div class="date-msg" id="dateMsg"></div>
    </div>

    <button class="submit-btn" id="submitBtn" disabled>請完成上方欄位</button>
  </div>
</div>

<script>
/**
 * ★ 部署後，把下面這行換成你的「網頁應用程式網址」
 * 格式：https://script.google.com/macros/s/xxxxxxxx/exec
 */
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbz-fYX6Nf6mPuDjzk-C1msvAlgBTketGgslwfIxN9CZzUJ-leDUEpsMOwpr-iOISDGe/exec';

const WD_NAME = ['日','一','二','三','四','五','六'];

const state = {
  group: null,          // '星期四團' | '星期六團'
  action: null,          // '請假' | '銷假'
  dateValid: false,      // 日期是否為星期四／星期六，且與所屬團一致
  hasLeaveForSelected: null // 銷假模式下，是否查到有效請假紀錄
};

const $ = (id) => document.getElementById(id);
const todayBadge = $('todayBadge');
const nameInput  = $('nameInput');
const dateInput  = $('dateInput');
const dateMsg    = $('dateMsg');
const submitBtn  = $('submitBtn');
const groupCards = document.querySelectorAll('[data-group]');
const actionCards = document.querySelectorAll('[data-action]');

/** 顯示今天日期（登入時自動帶入，並預設帶入日期欄位方便使用者微調） */
function renderToday() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  todayBadge.textContent = `今天是 ${y}年${m}月${d}日（星期${WD_NAME[now.getDay()]}）`;
  dateInput.value = `${y}-${m}-${d}`;
}

function setDateMsg(type, text) {
  dateMsg.className = 'date-msg show ' + type;
  dateMsg.textContent = text;
}
function clearDateMsg() {
  dateMsg.className = 'date-msg';
  dateMsg.textContent = '';
}

/** 呼叫後端 GET API */
async function callApi(params) {
  const url = WEBAPP_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  return res.json();
}

/** 卡片選取（所屬團） */
groupCards.forEach(card => {
  card.addEventListener('click', () => {
    groupCards.forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    state.group = card.dataset.group;
    validateDate();
  });
});

/** 卡片選取（動作） */
actionCards.forEach(card => {
  card.addEventListener('click', () => {
    actionCards.forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    state.action = card.dataset.action;
    submitBtn.classList.toggle('danger', state.action === '銷假');
    state.hasLeaveForSelected = null;
    if (state.action === '銷假') {
      checkCancelEligibility();
    } else {
      clearDateMsg();
      validateDate(true);
    }
    refreshSubmitState();
  });
});

/**
 * 驗證日期是否為星期四／星期六，並與所屬團一致。
 * skipCancelCheck: true 時只做星期驗證，不觸發銷假查詢（例如切到請假模式時）
 */
function validateDate(skipCancelCheck) {
  const val = dateInput.value;
  if (!val) { state.dateValid = false; clearDateMsg(); refreshSubmitState(); return; }

  const d = new Date(val + 'T00:00:00+08:00');
  const wd = d.getDay();

  if (wd !== 4 && wd !== 6) {
    state.dateValid = false;
    setDateMsg('error', `❌ 星期${WD_NAME[wd]}沒有練習，請選星期四或星期六`);
    refreshSubmitState();
    return;
  }

  const expectedGroup = wd === 4 ? '星期四團' : '星期六團';
  if (state.group && state.group !== expectedGroup) {
    state.dateValid = false;
    setDateMsg('error', `❌ 星期${WD_NAME[wd]}屬於「${expectedGroup}」，與你選的所屬團不符`);
    refreshSubmitState();
    return;
  }

  state.dateValid = true;
  if (state.action !== '銷假' || skipCancelCheck) {
    setDateMsg('ok', `✅ 星期${WD_NAME[wd]}，可以${state.action === '銷假' ? '銷假' : '請假'}`);
  }
  refreshSubmitState();

  if (state.action === '銷假' && !skipCancelCheck) {
    checkCancelEligibility();
  }
}

/**
 * ★ 銷假前的必要檢查：
 * 姓名、所屬團、日期都填妥且日期有效時，先呼叫 checkStatus
 * 確認資料庫是否存在對應的請假中紀錄。
 * 查無資料 → 顯示「您目前沒有可銷假的紀錄」並鎖住送出按鈕。
 */
async function checkCancelEligibility() {
  const name = nameInput.value.trim();
  const date = dateInput.value;
  if (!name || !state.group || !date || !state.dateValid) {
    state.hasLeaveForSelected = null;
    refreshSubmitState();
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = '查詢中…';
  setDateMsg('info', '🔍 查詢請假紀錄中…');

  try {
    const result = await callApi({ action: 'checkStatus', name, group: state.group, date });
    if (result.status !== 'ok') throw new Error(result.message || '查詢失敗');

    state.hasLeaveForSelected = result.hasLeave;
    if (!result.hasLeave) {
      setDateMsg('error', '❌ 您目前沒有可銷假的紀錄');
    } else {
      setDateMsg('ok', `✅ 已找到「${name}」在 ${date} 的請假紀錄，可以送出銷假`);
    }
  } catch (err) {
    state.hasLeaveForSelected = null;
    setDateMsg('error', '查詢時發生錯誤：' + err.message);
  }
  refreshSubmitState();
}

function refreshSubmitState() {
  const name = nameInput.value.trim();
  const ready = name && state.group && state.action && dateInput.value && state.dateValid;

  if (!ready) {
    submitBtn.disabled = true;
    submitBtn.textContent = '請完成上方欄位';
    return;
  }

  if (state.action === '請假') {
    submitBtn.disabled = false;
    submitBtn.textContent = '送出請假';
  } else {
    if (state.hasLeaveForSelected === true) {
      submitBtn.disabled = false;
      submitBtn.textContent = '送出銷假';
    } else {
      submitBtn.disabled = true;
      submitBtn.textContent = state.hasLeaveForSelected === false ? '無法銷假' : '尚未確認可銷假';
    }
  }
}

async function handleSubmit() {
  const name = nameInput.value.trim();
  const date = dateInput.value;
  if (!name || !state.group || !state.action || !date || !state.dateValid) return;

  if (state.action === '銷假' && state.hasLeaveForSelected !== true) {
    setDateMsg('error', '❌ 您目前沒有可銷假的紀錄');
    return;
  }

  submitBtn.disabled = true;
  const originalText = submitBtn.textContent;
  submitBtn.innerHTML = '<span class="spinner"></span>送出中…';

  try {
    const result = await callApi({ action: state.action, name, group: state.group, date });
    if (result.status === 'ok') {
      setDateMsg('ok', state.action === '請假' ? '🎉 請假成功！' : '🎉 銷假成功！');
      if (state.action === '銷假') state.hasLeaveForSelected = false;
    } else {
      setDateMsg('error', '❌ ' + (result.message || '操作失敗，請稍後再試'));
    }
  } catch (err) {
    setDateMsg('error', '連線發生錯誤：' + err.message);
  }

  submitBtn.textContent = originalText;
  refreshSubmitState();
}

// ===== 事件綁定 =====
nameInput.addEventListener('input', () => {
  if (state.action === '銷假') {
    state.hasLeaveForSelected = null;
    checkCancelEligibility();
  } else {
    refreshSubmitState();
  }
});
dateInput.addEventListener('change', () => validateDate());
submitBtn.addEventListener('click', handleSubmit);

// ===== 初始化 =====
renderToday();
validateDate(true);
refreshSubmitState();
</script>
</body>
</html>
